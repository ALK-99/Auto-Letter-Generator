name: Build PC dan Android

# Jalan otomatis saat kamu push tag versi, misalnya: git tag v1.1.0 && git push --tags
# Bisa juga dijalankan manual dari tab Actions (hasilnya jadi Artifacts, bukan Release).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pc:
    runs-on: windows-latest
    env:
      REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node set-version.js
      - run: npm install
      - run: npm run build:pc
      - uses: actions/upload-artifact@v4
        with:
          name: surat-otomatis-pc
          path: dist/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    env:
      REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node set-version.js
      - run: npm install
      - run: npx cap add android
      # Keystore tetap supaya APK versi baru bisa menimpa versi lama tanpa uninstall
      - name: Pasang keystore tetap
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Atur nomor versi
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Cek isi aplikasi dan kunci penandatangan (untuk log)
        run: |
          grep -o "APP_VERSION='[^']*'" android/app/src/main/assets/public/index.html || true
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA256:" || true
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Beri nama APK sesuai versi
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "Surat-Otomatis-$V.apk"
          ls -la Surat-Otomatis-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: surat-otomatis-android
          path: Surat-Otomatis-*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Surat-Otomatis-*.apk
          generate_release_notes: true
